name: Build & Push to Docker Hub (DESACTIVADO)

# ⚠️ DESACTIVADO el 2026-08-05.
#
# Este workflow publicaba las imágenes del sistema en Docker Hub en cada push a
# main. El 2026-07-24 se decidió lo contrario: modelo de instalación asistida,
# repo privado, cero distribución de imágenes (los repos mw0rk/* se eliminaron
# justamente por ser públicos). Dejarlo con trigger en push significaba regalar
# la app corriendo la primera vez que se subiera código con los secrets puestos.
#
# Queda solo con `workflow_dispatch` (arranque manual) por si algún día se
# vuelve al modelo de registry. Si esa decisión ya no está en discusión,
# borrar este archivo.
on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx (multi-platform)
        uses: docker/setup-buildx-action@v3

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Backend Django ──────────────────────────────────────────────────
      - name: Build y push — backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sistematic-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/sistematic-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Frontend React/Nginx ────────────────────────────────────────────
      - name: Build y push — frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sistematic-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/sistematic-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Notificación (opcional) ─────────────────────────────────────────
      - name: Resumen del build
        run: |
          echo "✅ Imágenes publicadas:"
          echo "  ${{ secrets.DOCKERHUB_USERNAME }}/sistematic-backend:latest"
          echo "  ${{ secrets.DOCKERHUB_USERNAME }}/sistematic-frontend:latest"
          echo "  Tag commit: ${{ github.sha }}"
          echo ""
          echo "Watchtower en todos los colegios detectará el cambio en ~24h."
